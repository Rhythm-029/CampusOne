server:
  port: 8080

spring:
  application:
    name: campusone-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campusone}
      database: ${MONGODB_DATABASE:campusone}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:h2:mem:campusone_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

campusone:
  auth:
    jwt-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    jwt-expiration-ms: 86400000 # 24 hours
    admin-master-password: Password123!
    allowed-domains:
      - atlasskilltech.university
      - atlasuniversity.edu.in
      - ugdx.edu.in
      - campusone.edu

